[project]
name = "encoded-memory"
version = "0.3.0"
description = "A faultforge experiment for injection into ECC-protected model parameters"
readme = "README.md"
authors = [
    { name = "Marten Roots", email = "marten.roots@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faultforge>=0.3.0,<0.4.0",
    # NumPy removes deprecated APIs in minor releases.
    # See https://numpy.org/neps/nep-0023-backwards-compatibility.html
    "numpy>=2.5.0,<2.6.0",
    "pydantic>=2.13.4,<3.0.0",
    # PyTorch removes deprecated APIs in minor releases.
    # See https://github.com/pytorch/pytorch/wiki/PyTorch's-Python-Frontend-Backward-and-Forward-Compatibility-Policy
    "torch>=2.12.1,<2.13.0",
    "typer>=0.25.1,<0.26.0",
]

[project.scripts]
encoded-memory = "encoded_memory.main:main"

[project.urls]
Repository = "https://github.com/rezzubs/faultforge"
Issues = "https://github.com/rezzubs/faultforge/issues"
Changelog = "https://github.com/rezzubs/faultforge/blob/main/CHANGELOG.md"

[tool.uv.sources]
faultforge = { workspace = true }

[build-system]
requires = ["uv-build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
