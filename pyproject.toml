[project]
name = "faultforge"
version = "0.3.0"
description = "A framework for reproducible hardware fault-injection experiments on PyTorch models"
readme = "README.md"
license = "UPL-1.0"
license-files = ["LICENSE"]
authors = [
    { name = "Marten Roots", email = "marten.roots@gmail.com" },
    { name = "Sven-Markus Loorits", email = "sven.loorits@proton.me" },
]
# The Rust extension is built per Python minor. A new Python minor needs a
# `pyo3` version that supports it, see `Cargo.toml`.
requires-python = ">=3.14"
# Upper bounds exclude the next breaking release. Packages that don't follow
# semver have a comment explaining their bound.
dependencies = [
    # NumPy removes deprecated APIs in minor releases.
    # See https://numpy.org/neps/nep-0023-backwards-compatibility.html
    # The Rust extension only requires 2.x, see the `numpy` crate in
    # `Cargo.toml`.
    "numpy>=2.5.0,<2.6.0",
    "pillow>=12.2.0,<13.0.0",
    "pydantic>=2.13.4,<3.0.0",
    # SciPy removes deprecated APIs in minor releases.
    # See https://docs.scipy.org/doc/scipy/dev/core-dev/index.html#deprecations
    "scipy>=1.18.0,<1.19.0",
    # New features ship in 1.0.x patch releases, so a minor release may break.
    # See https://github.com/huggingface/pytorch-image-models/releases
    "timm>=1.0.27,<1.1.0",
    # PyTorch removes deprecated APIs in minor releases.
    # See https://github.com/pytorch/pytorch/wiki/PyTorch's-Python-Frontend-Backward-and-Forward-Compatibility-Policy
    # Bump together with torchvision.
    "torch>=2.12.1,<2.13.0",
    # Each torchvision minor is paired with one torch minor.
    # See https://github.com/pytorch/vision#installation
    "torchvision>=0.27.1,<0.28.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/rezzubs/faultforge"
Issues = "https://github.com/rezzubs/faultforge/issues"
Changelog = "https://github.com/rezzubs/faultforge/blob/main/CHANGELOG.md"

[tool.uv.workspace]
members = ["experiments/encoded_memory"]

[tool.uv]
default-groups = ["dev"]
# `uv add` writes an upper bound excluding the next breaking release, treating
# the first nonzero version component as breaking (`0.x` minors, `0.0.x`
# patches).
# See https://docs.astral.sh/uv/reference/settings/#add-bounds and
# https://github.com/astral-sh/uv/issues/19047 for the `0.x` behavior.
add-bounds = "major"
# Rebuild the extension when Rust sources change, not only when
# `pyproject.toml` does.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
]

[dependency-groups]
dev = [
    "hypothesis>=6.155.7,<7.0.0",
    # Keep in sync with `build-system.requires`.
    "maturin>=1.14.1,<2.0.0",
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.9,<0.17.0",
    "ty>=0.0.84,<0.0.85",
]

[build-system]
# Keep in sync with the `dev` dependency group.
requires = ["maturin>=1.14.1,<2.0.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "faultforge._rust"
manifest-path = "crates/bindings/Cargo.toml"
python-source = "src"

[tool.ty.rules]
missing-override-decorator = "warn"

[tool.ruff]
target-version = "py314"
