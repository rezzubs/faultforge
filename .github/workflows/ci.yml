name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@v35

      # Both jobs use the same dev shell, so they share one store cache.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}

      # Exports the dev shell to all later steps, including `uses:` steps.
      - uses: nicknovitski/nix-develop@v1

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: just lint-rust

      - name: Format
        run: just fmt-check-rust

      - name: Test
        run: just test-rust

      - name: Documentation
        run: just doc-rust

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@v35

      # Both jobs use the same dev shell, so they share one store cache.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}

      # Exports the dev shell to all later steps, including `uses:` steps.
      - uses: nicknovitski/nix-develop@v1

      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv/python
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', '.python-version') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install
        run: uv sync --locked --all-packages

      - name: Type check
        run: just typecheck-python

      - name: Lint
        run: just lint-python

      - name: Format
        run: just fmt-check-python

      - name: Test
        run: just test-python

      # Drops downloaded wheels, which are about as fast to re-download as to
      # restore, but keeps wheels built from source.
      - name: Prune uv cache
        run: uv cache prune --ci
