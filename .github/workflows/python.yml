name: Python

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "src/**"
      - "tests/**"
      - "experiments/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "crates/**"
      - "src/**"
      - "tests/**"
      - "experiments/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/python.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: extractions/setup-just@v3

      - name: Install
        run: uv sync --locked --all-packages

      - name: Type check
        run: just typecheck-python

      - name: Lint
        run: just lint-python

      - name: Format
        run: just fmt-check-python

      - name: Test
        run: just test-python
