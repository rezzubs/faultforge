[package]
name = "syndromes"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
ariadne.workspace = true
clap.workspace = true
color-eyre.workspace = true
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
egui_plot = { workspace = true, optional = true }
eyre.workspace = true
logic_simulation = { path = "../logic_simulation" }
ndarray.workspace = true
ndarray-npy = "0.10"
rand = { workspace = true, features = ["chacha"] }
rand_distr = "0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror.workspace = true
toml = "0.9"

[features]
default = ["ui"]
# The window. Off makes a headless build that needs no graphics stack.
ui = ["dep:eframe", "dep:egui", "dep:egui_plot"]
