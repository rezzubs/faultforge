[package]
name = "bindings"
edition.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
# This name will be used for the .so file that is used by Python.
name = "_rust"

[dependencies]
memory = { path = "../memory", features = ["numpy"] }
picker = { path = "../picker" }

numpy.workspace = true
# Builds against the stable ABI, so one extension works on all CPython versions
# from 3.15. `abi3t` also covers free-threaded builds, which can't load plain
# `abi3` extensions. The minimum must match `requires-python` in
# `pyproject.toml`.
# See https://pyo3.rs/v0.30.1/building-and-distribution.html#py_limited_apiabi3abi3t
pyo3 = { workspace = true, features = ["abi3t-py315"] }
rand.workspace = true
rayon.workspace = true
