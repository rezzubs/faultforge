[workspace]
resolver = "3"
members = ["./crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["Marten Roots"]


[workspace.dependencies]
ariadne = "0.6.0"
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
eyre = "0.6.12"
ndarray = "0.17.2"
# Must use the same `pyo3` version as the workspace. `pyo3-ffi` sets
# `links = "python"` and Cargo allows only one package per `links` value.
# See https://doc.rust-lang.org/cargo/reference/build-scripts.html#the-links-manifest-key
# Uses the NumPy 2 C API at runtime, so it works with any 2.x release of the
# Python `numpy` package, see `pyproject.toml`.
# See https://github.com/PyO3/rust-numpy/blob/v0.30.0/src/npyffi/mod.rs
numpy = "0.30.0"
proptest = "1.12.0"
# The extension is built for the stable ABI, see `crates/bindings/Cargo.toml`,
# so new Python minors don't need a bump. Bump together with `numpy`.
pyo3 = "0.30.1"
rand = "0.10.4"
rayon = "1.12.0"
thiserror = "2.0.21"
