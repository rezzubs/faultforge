[workspace]
resolver = "3"
members = ["./crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["Marten Roots"]


[workspace.dependencies]
ariadne = "0.6.0"
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
eyre = "0.6.12"
ndarray = "0.17.2"
numpy = "0.29.0"
proptest = "1.11.0"
pyo3 = "0.29.0"
rand = "0.10.1"
rayon = "1.12.0"
thiserror = "2.0.18"
